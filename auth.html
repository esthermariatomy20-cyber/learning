<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | XceptionalLEARNING</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --xcept-dark-blue: #3e5c76;
            --xcept-green:     #8eb444;
            --xcept-orange:    #f08b4c;
            --xcept-light-blue:#00afee;
            --bg-soft:         #f8fafc;
            --text-dark:       #1e293b;
        }
        *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

        body {
            font-family:'Roboto',sans-serif;
            background:var(--bg-soft);
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:2rem 1rem;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(0,175,238,0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(142,180,68,0.06) 0%, transparent 50%);
        }

        .auth-wrapper { width:100%; max-width:460px; }

        .logo-area { text-align:center; margin-bottom:2rem; animation:slideDown 0.5s ease; }
        .logo-area img { max-width:220px; height:auto; }

        .auth-card {
            background:#fff;
            border-radius:24px;
            padding:2.5rem 2.5rem 2rem;
            box-shadow:0 20px 60px rgba(62,92,118,0.13), 0 4px 16px rgba(0,0,0,0.04);
            animation:slideUp 0.5s ease;
        }

        .tab-row {
            display:flex; background:#f1f5f9;
            border-radius:12px; padding:4px; margin-bottom:2rem;
        }
        .tab-btn {
            flex:1; padding:0.7rem; border:none; background:none;
            border-radius:9px; font-family:'Montserrat',sans-serif;
            font-weight:600; font-size:0.88rem; cursor:pointer;
            color:#64748b; transition:all 0.25s;
        }
        .tab-btn.active {
            background:#fff; color:var(--xcept-dark-blue);
            box-shadow:0 2px 8px rgba(0,0,0,0.08);
        }

        .form-panel { display:none; }
        .form-panel.active { display:block; animation:fadeIn 0.35s ease; }

        .form-title {
            font-family:'Montserrat',sans-serif; font-size:1.35rem;
            font-weight:700; color:var(--xcept-dark-blue); margin-bottom:0.35rem;
        }
        .form-sub { color:#64748b; font-size:0.88rem; margin-bottom:1.6rem; }

        .field { margin-bottom:1.1rem; }
        .field label {
            display:block; font-size:0.78rem; font-weight:600;
            color:var(--xcept-dark-blue); text-transform:uppercase;
            letter-spacing:0.6px; margin-bottom:0.45rem;
        }
        .field input {
            width:100%; padding:0.82rem 1rem;
            border:1.5px solid #e2e8f0; border-radius:10px;
            font-family:'Roboto',sans-serif; font-size:0.95rem;
            color:var(--text-dark); outline:none; background:#fff;
            transition:border-color 0.2s, box-shadow 0.2s;
        }
        .field input:focus {
            border-color:var(--xcept-light-blue);
            box-shadow:0 0 0 3px rgba(0,175,238,0.12);
        }

        .strength-bar { height:4px; background:#e2e8f0; border-radius:2px; margin-top:6px; }
        .strength-fill { height:100%; border-radius:2px; transition:width 0.3s,background 0.3s; width:0; }
        .strength-hint { font-size:0.75rem; margin-top:4px; color:#94a3b8; }

        .btn-main {
            width:100%; padding:0.95rem;
            background:var(--xcept-orange); color:#fff;
            border:none; border-radius:12px;
            font-family:'Montserrat',sans-serif; font-weight:700;
            font-size:1rem; cursor:pointer;
            transition:background 0.2s, transform 0.15s, box-shadow 0.2s;
            margin-top:0.4rem;
        }
        .btn-main:hover { background:#e07840; transform:translateY(-1px); box-shadow:0 6px 20px rgba(240,139,76,0.32); }
        .btn-main:disabled { opacity:0.6; cursor:not-allowed; transform:none; }

        .btn-google {
            width:100%; padding:0.85rem; background:#fff;
            border:1.5px solid #e2e8f0; border-radius:12px;
            font-family:'Montserrat',sans-serif; font-weight:600;
            font-size:0.88rem; cursor:pointer; color:var(--text-dark);
            display:flex; align-items:center; justify-content:center;
            gap:0.65rem; transition:border-color 0.2s, background 0.2s;
            margin-top:0.7rem;
        }
        .btn-google:hover { border-color:var(--xcept-light-blue); background:#f8fafc; }

        .divider {
            display:flex; align-items:center;
            gap:0.9rem; margin:1.1rem 0;
            color:#94a3b8; font-size:0.8rem;
        }
        .divider::before,.divider::after { content:''; flex:1; height:1px; background:#e2e8f0; }

        .msg { padding:0.75rem 1rem; border-radius:8px; font-size:0.85rem; margin-bottom:1rem; display:none; }
        .msg.error   { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; display:block; }
        .msg.success { background:#f0fdf4; color:#16a34a; border:1px solid #bbf7d0; display:block; }

        .spinner {
            display:inline-block; width:15px; height:15px;
            border:2px solid rgba(255,255,255,0.4); border-top-color:#fff;
            border-radius:50%; animation:spin 0.75s linear infinite;
            margin-right:7px; vertical-align:middle;
        }

        .back-link { text-align:center; margin-top:1.4rem; font-size:0.83rem; color:#64748b; }
        .back-link a { color:var(--xcept-light-blue); text-decoration:none; font-weight:500; }
        .back-link a:hover { text-decoration:underline; }

        @keyframes slideDown { from{opacity:0;transform:translateY(-16px)} to{opacity:1;transform:translateY(0)} }
        @keyframes slideUp   { from{opacity:0;transform:translateY(16px)}  to{opacity:1;transform:translateY(0)} }
        @keyframes fadeIn    { from{opacity:0;transform:translateY(6px)}   to{opacity:1;transform:translateY(0)} }
        @keyframes spin      { to{transform:rotate(360deg)} }
    </style>
</head>
<body>

<div class="auth-wrapper">
    <div class="logo-area">
        <img src="XL.jpeg" alt="XceptionalLEARNING Logo">
    </div>

    <div class="auth-card">
        <div class="tab-row">
            <button class="tab-btn active" id="tab-login"  onclick="switchTab('login')">Login</button>
            <button class="tab-btn"        id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- LOGIN -->
        <div class="form-panel active" id="panel-login">
            <p class="form-title">Welcome back!</p>
            <p class="form-sub">Sign in to track your learning progress.</p>
            <div id="login-msg" class="msg"></div>
            <div class="field">
                <label>Email Address</label>
                <input type="email" id="login-email" placeholder="you@example.com">
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="Your password"
                       onkeydown="if(event.key==='Enter') handleLogin()">
            </div>
            <button class="btn-main" id="btn-login" onclick="handleLogin()">Sign In</button>
            <div class="divider">or</div>
            <button class="btn-google" onclick="handleGoogle()">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </button>
        </div>

        <!-- SIGN UP -->
        <div class="form-panel" id="panel-signup">
            <p class="form-title">Create account</p>
            <p class="form-sub">Join XceptionalLEARNING and start your AI journey.</p>
            <div id="signup-msg" class="msg"></div>
            <div class="field">
                <label>Your Name</label>
                <input type="text" id="signup-name" placeholder="e.g. Ravi Kumar">
            </div>
            <div class="field">
                <label>Email Address</label>
                <input type="email" id="signup-email" placeholder="you@example.com">
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="signup-password" placeholder="Minimum 6 characters"
                       oninput="checkStrength(this.value)"
                       onkeydown="if(event.key==='Enter') handleSignup()">
                <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
                <div class="strength-hint" id="strength-hint"></div>
            </div>
            <button class="btn-main" id="btn-signup" onclick="handleSignup()">Create Account</button>
            <div class="divider">or</div>
            <button class="btn-google" onclick="handleGoogle()">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continue with Google
            </button>
        </div>

        <div class="back-link"><a href="index.html">← Back to Learning Hub</a></div>
    </div>
</div>

<!-- ═══════════════════════════════════════════════════
     FIREBASE SDKs loaded via CDN (no import/export)
     This avoids the "not defined" error completely
════════════════════════════════════════════════════ -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// ══════════════════════════════════════════════════
//  STEP 1 — Paste YOUR Firebase config here
// ══════════════════════════════════════════════════
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig =
 {
  apiKey: "AIzaSyD3xlNMLwCMYHOXN2dw3mMleLRJtXPgEV8",
  authDomain: "website-e0b9c.firebaseapp.com",
  projectId: "website-e0b9c",
  storageBucket: "website-e0b9c.firebasestorage.app",
  messagingSenderId: "481294430393",
  appId: "1:481294430393:web:9d94dc343bf7aae2432b68",
  measurementId: "G-PLPB7GF0XW"
};
// ══════════════════════════════════════════════════

// Start Firebase
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

// If already logged in → go straight to home
auth.onAuthStateChanged(function(user) {
    if (user) window.location.href = 'index.html';
});

// ── Create Firestore profile for new users ───────
function ensureProfile(user) {
    var ref = db.collection('users').doc(user.uid);
    ref.get().then(function(snap) {
        if (!snap.exists) {
            ref.set({
                uid:                   user.uid,
                displayName:           user.displayName || 'Learner',
                email:                 user.email,
                createdAt:             firebase.firestore.FieldValue.serverTimestamp(),
                lastActive:            firebase.firestore.FieldValue.serverTimestamp(),
                totalQuizzes:          0,
                totalScore:            0,
                highestScore:          0,
                learningDaysCompleted: []
            });
        }
    });
}

// ── Friendly error messages ──────────────────────
function friendly(code) {
    var map = {
        'auth/user-not-found':        'No account found with that email.',
        'auth/wrong-password':        'Incorrect password. Please try again.',
        'auth/invalid-credential':    'Invalid email or password.',
        'auth/email-already-in-use':  'That email is already registered. Please login instead.',
        'auth/invalid-email':         'Please enter a valid email address.',
        'auth/weak-password':         'Password must be at least 6 characters.',
        'auth/popup-closed-by-user':  'Sign-in popup was closed.',
        'auth/too-many-requests':     'Too many attempts. Please wait a few minutes.',
        'auth/network-request-failed':'Network error. Please check your connection.',
        'auth/operation-not-allowed': 'Email sign-in not enabled. See Firebase Console.',
        'auth/unauthorized-domain':   'This domain is not authorised in Firebase Console.'
    };
    return map[code] || ('Error: ' + code + '. Please try again.');
}

function showMsg(id, text, type) {
    var el       = document.getElementById(id);
    el.textContent = text;
    el.className   = 'msg ' + type;
}

function setLoading(btnId, on, label) {
    var b    = document.getElementById(btnId);
    b.disabled = on;
    b.innerHTML = on
        ? '<span class="spinner"></span>Please wait…'
        : label;
}

// ══════════════════════════════════════════════════
//  LOGIN
// ══════════════════════════════════════════════════
function handleLogin() {
    var email = document.getElementById('login-email').value.trim();
    var pass  = document.getElementById('login-password').value;

    if (!email) { showMsg('login-msg', 'Please enter your email.',    'error'); return; }
    if (!pass)  { showMsg('login-msg', 'Please enter your password.', 'error'); return; }

    setLoading('btn-login', true, 'Sign In');

    auth.signInWithEmailAndPassword(email, pass)
        .then(function() {
            window.location.href = 'index.html';
        })
        .catch(function(e) {
            console.error('LOGIN ERROR:', e.code, e.message);
            showMsg('login-msg', friendly(e.code), 'error');
            setLoading('btn-login', false, 'Sign In');
        });
}

// ══════════════════════════════════════════════════
//  SIGN UP
// ══════════════════════════════════════════════════
function handleSignup() {
    var name  = document.getElementById('signup-name').value.trim();
    var email = document.getElementById('signup-email').value.trim();
    var pass  = document.getElementById('signup-password').value;

    // Validate
    if (!name)  { showMsg('signup-msg', '⚠️ Please enter your name.',         'error'); return; }
    if (!email) { showMsg('signup-msg', '⚠️ Please enter your email.',        'error'); return; }
    if (!email.includes('@')) { showMsg('signup-msg', '⚠️ Enter a valid email.', 'error'); return; }
    if (!pass)  { showMsg('signup-msg', '⚠️ Please enter a password.',        'error'); return; }
    if (pass.length < 6) { showMsg('signup-msg', '⚠️ Password needs 6+ characters.', 'error'); return; }

    setLoading('btn-signup', true, 'Create Account');

    // Step 1 — Create account
    auth.createUserWithEmailAndPassword(email, pass)
        .then(function(cred) {
            // Step 2 — Save display name
            return cred.user.updateProfile({ displayName: name })
                .then(function() {
                    // Step 3 — Create Firestore profile
                    ensureProfile({ uid: cred.user.uid, displayName: name, email: email });
                    // Step 4 — Show success
                    showMsg('signup-msg', '✅ Account created! Taking you to the hub…', 'success');
                    setTimeout(function() { window.location.href = 'index.html'; }, 1500);
                });
        })
        .catch(function(e) {
            console.error('SIGNUP ERROR:', e.code, e.message);
            showMsg('signup-msg', friendly(e.code), 'error');
            setLoading('btn-signup', false, 'Create Account');
        });
}

// ══════════════════════════════════════════════════
//  GOOGLE SIGN IN
// ══════════════════════════════════════════════════
function handleGoogle() {
    var provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider)
        .then(function(result) {
            ensureProfile(result.user);
            window.location.href = 'index.html';
        })
        .catch(function(e) {
            console.error('GOOGLE ERROR:', e.code, e.message);
            showMsg('login-msg',  friendly(e.code), 'error');
            showMsg('signup-msg', friendly(e.code), 'error');
        });
}

// ══════════════════════════════════════════════════
//  TAB SWITCHING
// ══════════════════════════════════════════════════
function switchTab(tab) {
    ['login','signup'].forEach(function(t) {
        document.getElementById('tab-'  +t).classList.toggle('active', t===tab);
        document.getElementById('panel-'+t).classList.toggle('active', t===tab);
    });
}

// ══════════════════════════════════════════════════
//  PASSWORD STRENGTH METER
// ══════════════════════════════════════════════════
function checkStrength(val) {
    var score = 0;
    if (val.length >= 6)           score++;
    if (val.length >= 10)          score++;
    if (/[A-Z]/.test(val))         score++;
    if (/[0-9]/.test(val))         score++;
    if (/[^A-Za-z0-9]/.test(val))  score++;

    var fill = document.getElementById('strength-fill');
    var hint = document.getElementById('strength-hint');
    fill.style.width      = (score/5*100)+'%';
    fill.style.background = score<=1 ? '#ef4444' : score<=3 ? '#f59e0b' : '#22c55e';
    hint.textContent      = score<=1 ? 'Weak — keep typing'
                          : score<=3 ? 'Medium — add numbers or symbols'
                          : 'Strong password ✓';
    hint.style.color      = score<=1 ? '#ef4444' : score<=3 ? '#f59e0b' : '#22c55e';
}
</script>

</body>
</html>
